site_name: Jiuwen Knowledge Base
site_description: Offline build of the Jiuwen AI-Engineering Knowledge Base
docs_dir: ../build/docs
site_dir: ../build/site
use_directory_urls: false

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-6
        name: Switch light/dark
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.top
    - navigation.tracking
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - offline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

extra_css:
  - assets/study.css
extra_javascript:
  - assets/study.js

nav:
  - Home: index.md
  - Model foundations:
      - LLM foundations: 01-llm-foundations.md
      - Prompting & output: 02-prompting-and-output-control.md
      - LLM terms glossary: 03-llm-terms-glossary.md
      - Choosing models & approaches: 04-choosing-models-and-approaches.md
  - Agents:
      - Agent fundamentals & the loop: 05-agent-fundamentals-and-the-loop.md
      - Tools & function calling: 06-tools-and-function-calling.md
      - Planning, memory & state: 07-planning-memory-and-state.md
      - Agent frameworks: 08-agent-frameworks.md
      - Multi-agent systems: 09-multi-agent-systems.md
  - RAG:
      - RAG pipelines & patterns: 10-rag-pipelines-and-patterns.md
      - Retrieval & ranking: 11-retrieval-and-ranking.md
      - Query understanding: 12-query-understanding.md
      - RAG failure modes & evaluation: 13-rag-failure-modes-and-evaluation.md
      - RAG system design: 14-rag-system-design.md
  - Evaluation & production:
      - Evaluation: 15-evaluation.md
      - Production & scale: 16-production-cost-and-scale.md
  - Model adaptation:
      - Fine-tuning: 17-fine-tuning-and-customization.md
  - Safety & security:
      - Security & safety: 18-security-and-safety.md
