site_name: Jiuwen Knowledge Base
site_description: Offline build of the Jiuwen AI-Engineering Knowledge Base
docs_dir: ../build/docs
site_dir: ../build/site
use_directory_urls: false

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-6
        name: Switch light/dark
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - offline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

extra_css:
  - assets/study.css
extra_javascript:
  - assets/study.js

nav:
  - Home: index.md
  - Foundations:
      - LLM foundations: 01-llm-foundations.md
      - Prompting & output: 02-prompting-and-output-control.md
      - LLM terms glossary: 03-llm-terms-glossary.md
  - Agents:
      - Agents, tools & memory: 04-agents-tools-and-memory.md
  - Retrieval & RAG:
      - RAG & retrieval: 05-rag-and-retrieval.md
      - RAG system design: 06-rag-system-design.md
  - Quality & operations:
      - Evaluation: 07-evaluation.md
      - Production & scale: 08-production-cost-and-scale.md
  - Trust & safety:
      - Security & safety: 09-security-and-safety.md
  - Customization & engineering:
      - Fine-tuning: 10-fine-tuning-and-customization.md
      - General engineering: 11-general-engineering.md
  - Patterns:
      - AI engineer interview patterns: 12-ai-engineer-interview-patterns.md
      - LLM interview patterns: 13-llm-interview-patterns.md
      - LLM architecture patterns: 14-llm-architecture-patterns.md
