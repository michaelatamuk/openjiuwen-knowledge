site_name: Jiuwen Knowledge Base
site_description: Offline build of the Jiuwen AI-Engineering Knowledge Base
docs_dir: ../build/docs
site_dir: ../build/site
use_directory_urls: false

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-6
        name: Switch light/dark
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.top
    - navigation.tracking
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - offline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

extra_css:
  - assets/site.css
extra_javascript:
  - assets/site.js

nav:
  - Home: index.md
  - Building with agents:
      - The agent:
          - Agent fundamentals & the loop: 05-agent-fundamentals-and-the-loop.md
          - Agent architectures & protocols: 21-agent-architectures.md
      - What the agent uses:
          - Tools & function calling: 06-tools-and-function-calling.md
          - Planning, memory & state: 07-planning-memory-and-state.md
      - Composing agents:
          - Agent frameworks: 08-agent-frameworks.md
          - Multi-agent systems: 09-multi-agent-systems.md
      - Making agents reliable:
          - Agent failure modes: 22-agent-failure-patterns.md
          - Evaluation: 15-evaluation.md
      - Running agents:
          - Production, cost & scale: 16-production-cost-and-scale.md
          - Model routing & gateways: 24-ai-gateway.md
      - Securing agents:
          - Security & safety: 18-security-and-safety.md
  - Under the hood:
      - The model:
          - LLM foundations: 01-llm-foundations.md
          - AI system stack: 20-ai-system-stack.md
          - Foundational papers: 19-foundational-papers.md
      - Working with the model:
          - Prompting & output control: 02-prompting-and-output-control.md
          - Choosing models & approaches: 04-choosing-models-and-approaches.md
          - Fine-tuning & customization: 17-fine-tuning-and-customization.md
          - Cost, latency & accuracy tradeoffs: 23-cost-latency-accuracy.md
      - Retrieval internals:
          - RAG pipelines & patterns: 10-rag-pipelines-and-patterns.md
