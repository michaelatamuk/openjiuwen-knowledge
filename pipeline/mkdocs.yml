site_name: Jiuwen Knowledge Base
site_description: Offline build of the Jiuwen AI-Engineering Knowledge Base
docs_dir: ../build/docs
site_dir: ../build/site
use_directory_urls: false

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-6
        name: Switch light/dark
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.top
    - navigation.tracking
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - offline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

extra_css:
  - assets/site.css
extra_javascript:
  - assets/site.js

nav:
